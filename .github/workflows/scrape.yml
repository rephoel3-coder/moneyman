name: Scrape
on:
  workflow_dispatch:
  schedule:
    # Fires every 15 min from 01:00-04:45 UTC. That window covers true
    # 4:30am Israel local time on both sides of the DST switch - Daylight
    # Time (UTC+3, roughly late Mar-late Oct: 4:30am local = 01:30 UTC)
    # and Standard Time (UTC+2, roughly late Oct-late Mar: 4:30am local =
    # 02:30 UTC) - plus buffer for GitHub Actions' own scheduling delay
    # (observed up to ~110 min late). It does NOT scrape on every tick;
    # see the "Check if it's time" step below for why.
    - cron: "*/15 1-4 * * *"
jobs:
  scrape:
    # Runs on the account owner's own Windows machine (self-hosted runner)
    # instead of GitHub's cloud servers, because Pagi's site blocks/challenges
    # traffic from cloud datacenter IPs specifically.
    runs-on: [self-hosted, Windows]
    steps:
      # Every 15-min tick reaches this step, but only the first one at/after
      # true 4:30am Israel local time (computed live, so this is correct
      # through every DST change forever - no manual toggling needed) is
      # allowed to actually scrape. A manual "Run workflow" click always
      # goes through immediately, ignoring the clock.
      - name: Check if it's time
        id: timing
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "Manual trigger - running regardless of the clock."
            "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $nowLocal = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "Israel Standard Time").ToString("HHmm")
          Write-Host "Current Israel local time: $nowLocal"
          if ([int]$nowLocal -ge 430) {
            Write-Host "At or after 4:30am local - eligible to scrape."
            "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Before 4:30am local - too early, skipping this tick."
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Today's date (Israel)
        if: steps.timing.outputs.ok == 'true'
        id: today
        shell: powershell
        run: |
          $todayIL = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "Israel Standard Time").ToString("yyyy-MM-dd")
          "date=$todayIL" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # A scheduled tick that's on-or-after 4:30am is otherwise eligible to
      # scrape on EVERY tick until 04:45 UTC - this cache marker is what
      # stops it from actually re-scraping every 15 min all morning once
      # today's run has already succeeded once. Skipped entirely for a
      # manual dispatch, which should always run regardless.
      - name: Check if already scraped today
        if: steps.timing.outputs.ok == 'true' && github.event_name != 'workflow_dispatch'
        id: dedup
        uses: actions/cache/restore@v4
        with:
          path: .scrape-marker
          key: scraped-${{ steps.today.outputs.date }}

      - name: Run scraper
        if: steps.timing.outputs.ok == 'true' && steps.dedup.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $config = $env:MONEYMAN_CONFIG | ConvertFrom-Json
          $config.storage.googleSheets.serviceAccountPrivateKey = $env:GOOGLE_PRIVATE_KEY
          $env:MONEYMAN_CONFIG = $config | ConvertTo-Json -Depth 20 -Compress

          New-Item -ItemType Directory -Force -Path .failure-screenshots | Out-Null

          docker run --rm `
            -e MONEYMAN_CONFIG `
            -e TZ="Asia/Jerusalem" `
            -v "${PWD}\.failure-screenshots:/tmp/moneyman" `
            -v "C:\actions-runner\certs:/certs" `
            ghcr.io/rephoel3-coder/moneyman:latest

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path .scrape-marker | Out-Null
          Get-Date | Out-File -FilePath .scrape-marker/done
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      # Screenshots taken on scrape failure end up here (see failureScreenshot.ts).
      # Uploading them lets us see exactly what the automated browser hit,
      # even though the run itself is otherwise not exposed anywhere without
      # Telegram configured.
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: .failure-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Save today's marker so later ticks skip
        if: steps.timing.outputs.ok == 'true' && steps.dedup.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .scrape-marker
          key: scraped-${{ steps.today.outputs.date }}
